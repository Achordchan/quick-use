name: Script regression tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            engine: powershell
          - os: macos-latest
            engine: bash
          - os: ubuntu-latest
            engine: bash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        env:
          QUICK_USE_TEST_ENGINE: ${{ matrix.engine }}
